services:

  postgres:
    build: ./storage/postgres

    ports:
      - "5432:5432"

    secrets:
      - postgres_user
      - postgres_password
      - postgres_db

    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB_FILE: /run/secrets/postgres_db

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/postgres_user) -d $(cat /run/secrets/postgres_db)"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  api:
    build: ./api

    ports:
      - "8000:8000"

    secrets:
      - postgres_user
      - postgres_password
      - postgres_db

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:latest
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

secrets:

  postgres_user:
    file: ./storage/secrets/postgres_user.txt

  postgres_password:
    file: ./storage/secrets/postgres_password.txt

  postgres_db:
    file: ./storage/secrets/postgres_database.txt