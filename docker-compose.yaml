services:

  postgres:
    build: ./storage/postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    secrets:
      - postgres_user
      - postgres_password
      - postgres_db

    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB_FILE: /run/secrets/postgres_db

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/postgres_user) -d $(cat /run/secrets/postgres_db)"]
      interval: 5s
      timeout: 5s
      retries: 10

  map-renderer:
    build:
      context: .
      dockerfile: ./map-renderer/Dockerfile

    expose:
      - "8080"

    secrets:
      - maptiler_api_key

    environment:
      MAP_STYLE_POSTCARD: ${MAP_STYLE_POSTCARD:-}
      MAP_DEFAULT_ZOOM: ${MAP_DEFAULT_ZOOM:-10}
      MAP_OUTPUT_QUALITY: ${MAP_OUTPUT_QUALITY:-85}
      MAP_MARKER_PATH: /app/src/assets/map_marker.png
      HEADLESS: ${HEADLESS:-true}
      MAPTILER_API_KEY_FILE: /run/secrets/maptiler_api_key

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend

    ports:
      - "8000:8000"

    volumes:
      - ./storage/images:/app/storage/images:Z

    secrets:
      - postgres_user
      - postgres_password
      - postgres_db

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MAP_RENDERER_URL: http://map-renderer:8080
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-development-only-change-me-32-bytes}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://192.168.1.146:5173}
      MAP_DEFAULT_ZOOM: ${MAP_DEFAULT_ZOOM:-10}
      MAP_WIDTH: ${MAP_WIDTH:-600}
      MAP_HEIGHT: ${MAP_HEIGHT:-400}

    depends_on:
      postgres:
        condition: service_healthy
      map-renderer:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      secrets:
        - maptiler_api_key

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_started

  adminer:
    image: adminer:latest
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8081:8080"

secrets:

  postgres_user:
    file: ./secrets/postgres_user.txt

  postgres_password:
    file: ./secrets/postgres_password.txt

  postgres_db:
    file: ./secrets/postgres_database.txt

  maptiler_api_key:
    file: ./secrets/maptiler_api_key.txt

volumes:
  postgres_data:
  # backend_images:
