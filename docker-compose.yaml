services:

  postgres:
    build: ./storage/postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    secrets:
      - postgres_user
      - postgres_password
      - postgres_db

    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB_FILE: /run/secrets/postgres_db

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/postgres_user) -d $(cat /run/secrets/postgres_db)"]
      interval: 5s
      timeout: 5s
      retries: 10

  map-renderer:
    build:
      context: .
      dockerfile: ./map-renderer/Dockerfile

    expose:
      - "8080"

    environment:
      MAP_DEFAULT_ZOOM: ${MAP_DEFAULT_ZOOM:-10}
      MAP_OUTPUT_QUALITY: ${MAP_OUTPUT_QUALITY:-85}
      MAP_MARKER_PATH: /app/src/assets/map_marker.png
      HEADLESS: ${HEADLESS:-true}

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend

    ports:
      - "8000:8000"

    volumes:
      - ./storage/images:/app/storage/images:Z

    secrets:
      - postgres_user
      - postgres_password
      - postgres_db

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MAP_RENDERER_URL: http://map-renderer:8080
      MAP_DEFAULT_ZOOM: ${MAP_DEFAULT_ZOOM:-10}
      MAP_WIDTH: ${MAP_WIDTH:-600}
      MAP_HEIGHT: ${MAP_HEIGHT:-400}

    depends_on:
      postgres:
        condition: service_healthy
      map-renderer:
        condition: service_healthy

  adminer:
    image: adminer:latest
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8081:8080"

secrets:

  postgres_user:
    file: ./secrets/postgres_user.txt

  postgres_password:
    file: ./secrets/postgres_password.txt

  postgres_db:
    file: ./secrets/postgres_database.txt

volumes:
  postgres_data:
  # backend_images:
